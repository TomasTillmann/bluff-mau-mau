[package]
name = "bluff-mau-mau"
version = "0.1.0"
edition = "2024"
default-run = "server"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
ctrlc = { version = "3", features = ["termination"] }
chrono = "0.4"
fs2 = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
